{% extends 'website/common/base.html' %}

{% block main_content %}
<h1>welcome to ecom</h1>
<div class="product-list">
    {% for product in products %}
       <div class="product-item">
        <h2>{{ product.productname }}</h2>
        <p>Price : ${{ product.price }}</p>
        <p>{{ product.description }}</p>
       </div>
    {% empty %}
       <p>No products</p>
    {% endfor %}
</div>
{% endblock %}
